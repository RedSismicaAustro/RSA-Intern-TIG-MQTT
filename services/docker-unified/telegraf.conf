# ==============================================================================
# Telegraf Configuration - Red Sísmica del Austro (RSA)
# Stack Unificado: Telemetría de Sistema + Telemetría MQTT + Ingesta de Eventos
# ==============================================================================

[global_tags]
  # dc = "rsa-oficina"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = ""
  omit_hostname = false

# ==============================================================================
# OUTPUT PLUGINS (InfluxDB v2)
# ==============================================================================

# Output 1: Telemetría general y métricas de sistema -> Bucket "telemetry"
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
  namedrop = ["seismic_event"]

# Output 2: Catálogo de Eventos Sísmicos -> Bucket dedicado "rsa_events"
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_EVENTS_BUCKET}"
  namepass = ["seismic_event"]

# ==============================================================================
# INPUT PLUGINS: Métricas del Sistema (Host/Contenedor)
# ==============================================================================

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

[[inputs.kernel]]

[[inputs.mem]]

[[inputs.processes]]

[[inputs.swap]]

[[inputs.system]]

# ==============================================================================
# INPUT PLUGINS: Telemetría MQTT (Estaciones y Nodos)
# ==============================================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER}:1883"]
  topics = [
    "telemetry/+/data",
    "rsa/seismic/smart/+/telemetry/state",
    "rsa/seismic/smart/+/telemetry/health",
    "rsa/seismic/smart/+/telemetry/heartbeat",
    "rsa/seismic/smart/+/events/detected",
    "rsa/seismic/smart/+/events/data"
  ]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  qos = 0
  data_format = "json"
  json_string_fields = ["status", "last_event", "throttled"]

  # Topics: rsa/seismic/smart/{station_id}/telemetry/{data_type}
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "rsa/seismic/smart/+/telemetry/+"
    measurement = "_/_/_/_/_/_"
    tags = "_/_/_/station_id/_/data_type"

  # Topics: rsa/seismic/smart/{station_id}/events/{data_type}
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "rsa/seismic/smart/+/events/+"
    measurement = "_/_/_/_/_/_"
    tags = "_/_/_/station_id/_/data_type"

# ==============================================================================
# INPUT PLUGINS: Telemetría Especializada (Adquisición, Sensor, Drive)
# ==============================================================================

# Ingesta de Salud de Adquisición (Ring Buffer Watchdog)
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER}:1883"]
  topics = ["rsa/seismic/smart/+/status/acquisition"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  qos = 1
  name_override = "station_acquisition"
  data_format = "json"
  tag_keys = ["station_id", "status", "reason"]
  json_string_fields = ["last_frame_utc", "timestamp"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "rsa/seismic/smart/+/status/acquisition"
    measurement = "_/_/_/_/_/_"
    tags = "_/_/_/station_id/_/_"

# Ingesta de Comprobación Triaxial e Integridad del Sensor
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER}:1883"]
  topics = ["rsa/seismic/smart/+/status/sensor"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  qos = 1
  name_override = "station_sensor"
  data_format = "json"
  tag_keys = ["station_id", "status", "clock_source", "reason"]
  json_string_fields = ["clock_error", "timestamp"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "rsa/seismic/smart/+/status/sensor"
    measurement = "_/_/_/_/_/_"
    tags = "_/_/_/station_id/_/_"

# Ingesta de Estado de Sincronización Google Drive
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER}:1883"]
  topics = ["rsa/seismic/smart/+/status/drive"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  qos = 1
  name_override = "station_drive"
  data_format = "json"
  tag_keys = ["station_id", "status", "reason"]
  json_string_fields = ["last_upload_utc", "timestamp"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "rsa/seismic/smart/+/status/drive"
    measurement = "_/_/_/_/_/_"
    tags = "_/_/_/station_id/_/_"

# ==============================================================================
# INPUT PLUGINS: Ingesta de Metadatos de Eventos Sísmicos (Sesión Persistente)
# ==============================================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER}:1883"]
  topics = [
    "rsa/seismic/smart/events/metadata"
  ]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  qos = 1
  persistent_session = true
  client_id = "${TELEGRAF_CLIENT_ID}"
  data_format = "json_v2"
  name_override = "seismic_event"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "seismic_event"
    timestamp_path = "timestamp_utc"
    timestamp_format = "2006-01-02T15:04:05.000Z07:00"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "event_type"
      type = "string"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "source"
      type = "string"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "event_id"
      type = "string"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "stations"
      type = "string"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "n_stations"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "duration_s"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "request_id"
      type = "string"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "details"
      type = "string"
