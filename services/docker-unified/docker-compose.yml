# Docker Compose Unificado - TIG Stack + MQTT
# Red Sísmica del Austro (RSA) - Monitoring Dashboard
#
# Este archivo combina InfluxDB, Telegraf y Grafana en un único stack
# orquestado con dependencias y red compartida automática.
#
# Uso:
#   1. Copiar .env.example a .env y configurar credenciales
#   2. docker-compose up -d
#   3. Acceder a Grafana: http://localhost:3000
#   4. Acceder a InfluxDB: http://localhost:8086

services:
  # ============================================================================
  # InfluxDB - Base de datos de series temporales
  # ============================================================================
  influxdb:
    image: influxdb:2.7
    container_name: rsa-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      # Modo de inicialización automática
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_RETENTION=${INFLUXDB_RETENTION}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
    volumes:
      - ${DATA_DIR}/influxdb/data:/var/lib/influxdb2
      - ${DATA_DIR}/influxdb/config:/etc/influxdb2
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================================
  # Telegraf - Agente de recolección de métricas (MQTT Consumer)
  # ============================================================================
  telegraf:
    image: telegraf:1.28
    container_name: rsa-telegraf
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      # Configuración MQTT
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      # Configuración InfluxDB
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - INFLUXDB_EVENTS_BUCKET=${INFLUXDB_EVENTS_BUCKET:-rsa_events}
      - TELEGRAF_CLIENT_ID=${TELEGRAF_CLIENT_ID:-telegraf-events-oficina}
    volumes:
      # Montar configuración de Telegraf (ajustar ruta según tu proyecto)
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    networks:
      - monitoring
    # Telegraf no expone puertos por defecto (solo consume datos)

  # ============================================================================
  # Grafana - Dashboard de visualización
  # ============================================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: rsa-grafana
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "3000:3000"
    environment:
      # Credenciales de admin
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # Configuración regional
      - GF_DEFAULT_TIMEZONE=America/Guayaquil
      # Deshabilitar telemetría (opcional)
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Variables para Provisioning de InfluxDB
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
    volumes:
      - ${DATA_DIR}/grafana:/var/lib/grafana
      # Provisioning automático de datasources y dashboards
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================================
  # Correlador de Eventos Regionales - Servicio de Análisis Temporal MQTT
  # ============================================================================
  correlator:
    build:
      context: ../../scripts/correlator
      dockerfile: Dockerfile
    container_name: rsa-correlator
    restart: unless-stopped
    environment:
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    networks:
      - monitoring

  # ============================================================================
  # Event Analyzer - Visualizador Web de Eventos Sísmicos (Fase 1)
  # ============================================================================
  event-analyzer:
    build:
      context: ../event-analyzer
      dockerfile: Dockerfile
    container_name: rsa-event-analyzer
    restart: unless-stopped
    ports:
      - "8501:8501"
      - "8050:8050"
    volumes:
      - ../event-analyzer:/app
      - ${DRIVE_DIR}:/data/events:ro
    environment:
      - DATA_DIR=/data/events
      - TZ=America/Guayaquil
      - RESAMPLER_HOST=${RESAMPLER_HOST:-ubuntu-server}

    networks:
      - monitoring

# ==============================================================================
# Redes
# ==============================================================================
networks:
  monitoring:
    external: true
    name: rsa_network
    # Esta red permite que todos los servicios se comuniquen entre sí
    # Puedes conectar otros servicios externos usando:
    #   docker network connect monitoring <container_name>

